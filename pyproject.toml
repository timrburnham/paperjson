[project]
name = "paperjson"
version = "0.1.0"
description = "Paper-thin JSON serialization/deserialization for Python dataclasses"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Tim Burnham", email = "timrburnham@gmail.com"},
]
dependencies = []

[project.urls]
Homepage = "https://github.com/timrburnham/paperjson"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.ty.src]
exclude = ["tests/**"]

[tool.mypy]
exclude = ["tests/"]

[tool.ruff]
exclude = ["tests/"]

[tool.basedpyright]
include = ["src"]

exclude = ["tests"]

[tool.uv.sources]
paperjson = { workspace = true }

[dependency-groups]
dev = [
    "paperjson",
    "pytest>=8",
    "ruff",
    "ty",
]
